services:
  app1:
    image: ghcr.io/chinmay03droid/nginx-reverse-proxy-app1:latest
    build: ./app1
    container_name: app1
    ports:
      - "5001:5001"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  app2:
    image: ghcr.io/chinmay03droid/nginx-reverse-proxy-app2:latest
    build: ./app2
    container_name: app2
    ports:
      - "5002:5002"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
