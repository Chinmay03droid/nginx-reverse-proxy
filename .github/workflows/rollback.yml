name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character Git commit SHA of the images to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Rollback EC2 Deployment
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

    steps:
      - name: Validate input and secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: Enter a full 40-character lowercase Git SHA."
            exit 1
          fi

          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"

      - name: Verify requested images exist
        shell: bash
        run: |
          set -euo pipefail

          for app in app1 app2; do
            image="ghcr.io/chinmay03droid/nginx-reverse-proxy-${app}:${IMAGE_TAG}"
            echo "Checking $image"
            docker manifest inspect "$image" >/dev/null
          done

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Record current deployment
        id: current
        shell: bash
        run: |
          set -euo pipefail

          images=$(ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker inspect app1 app2 --format '{{.Config.Image}}'")

          app1_image=$(printf '%s\n' "$images" | sed -n '1p')
          app2_image=$(printf '%s\n' "$images" | sed -n '2p')

          app1_tag="${app1_image##*:}"
          app2_tag="${app2_image##*:}"

          if [[ ! "$app1_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot determine the current App 1 image SHA."
            exit 1
          fi

          if [[ "$app1_tag" != "$app2_tag" ]]; then
            echo "App 1 and App 2 use different image tags."
            exit 1
          fi

          echo "Current deployment: $app1_tag"
          echo "image_tag=$app1_tag" >> "$GITHUB_OUTPUT"

      - name: Deploy requested version
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "cd /home/ubuntu/nginx-reverse-proxy &&
             sudo IMAGE_TAG='$IMAGE_TAG' docker compose pull &&
             sudo IMAGE_TAG='$IMAGE_TAG' docker compose up -d --no-build --remove-orphans &&
             curl --fail --silent --show-error http://localhost/health &&
             curl --fail --silent --show-error http://localhost/app1/ &&
             curl --fail --silent --show-error http://localhost/app2/"

      - name: Restore previous version on failure
        if: steps.deploy.outcome == 'failure'
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.current.outputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$PREVIOUS_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot restore: previous image SHA is unavailable."
            exit 1
          fi

          echo "Restoring previous version: $PREVIOUS_TAG"

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "cd /home/ubuntu/nginx-reverse-proxy &&
             sudo IMAGE_TAG='$PREVIOUS_TAG' docker compose pull &&
             sudo IMAGE_TAG='$PREVIOUS_TAG' docker compose up -d --no-build --remove-orphans &&
             curl --fail --silent --show-error http://localhost/health &&
             curl --fail --silent --show-error http://localhost/app1/ &&
             curl --fail --silent --show-error http://localhost/app2/"

      - name: Report deployment failure
        if: steps.deploy.outcome == 'failure'
        shell: bash
        run: |
          echo "Requested deployment failed."
          echo "Previous-version restoration was attempted."
          exit 1

      - name: Clean up SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key
